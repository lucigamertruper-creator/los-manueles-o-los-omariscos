<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body {
            background-color: black;
            color: lime;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: all 1s ease-in-out;
        }
    </style>

<body>

    <h1>SYSTEM CORRUPTED...</h1>

    <script>
        
        let speech = new SpeechSynthesisUtterance("sistema sobrecargado por los meñus,adios.");
        speech.pitch = 0.3; 
        speech.rate = 0.9;  
        window.speechSynthesis.speak(speech);

        setTimeout(() => {
            document.body.style.transform = "rotate(180deg)";

            alert("Tu computadora esta poseida por omar.");
